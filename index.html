<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>主頁</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%;font-family: "Microsoft JhengHei", "Noto Sans TC", Arial, sans-serif;}
    .container{display:flex;min-height:100vh;}
    /* 側欄 */
    .sidebar{
      width:220px;
      background: rgba(250,250,250,0.96);
      border-right:1px solid rgba(0,0,0,0.06);
      padding:20px 12px;
      position:sticky; top:0; height:100vh; overflow:auto;
    }
    .sidebar h2{font-size:15px;color:#333;margin-bottom:10px;}
    .nav{list-style:none;}
    .nav li{margin:8px 0;}
    .nav a{color:#2e6da4;text-decoration:none;font-size:16px;display:inline-block;padding:6px 8px;border-radius:4px;}
    .nav a:hover{background:rgba(46,109,164,0.08);}
    /* 右側為 iframe 容器 */
    main.main{flex:1; padding:0; background:#fff; position:relative; min-height:100vh; display:flex; flex-direction:column;}
    .iframe-wrap{flex:1; border:0; height:100vh;}
    iframe#content-frame{width:100%; height:100%; border:0; display:block;}
    /* 小螢幕：側欄移上方水平捲動 */
    @media (max-width:720px){
      .container{flex-direction:column;}
      .sidebar{width:100%;height:auto;position:relative;display:flex;overflow-x:auto;white-space:nowrap;}
      .nav li{display:inline-block;margin-right:10px;}
      main.main{height:auto;}
      .iframe-wrap{height:80vh;}
    }
  </style>
</head>
<body>
  <div class="container">
    <aside class="sidebar" aria-label="主要目錄">
      <h2>目錄</h2>
      <ul class="nav">
        <!-- 這些連結 target="content-frame" 會在右側 iframe 中開啟對應頁面 -->
        <li><a href="index_2.html" target="content-frame">主頁</a></li>
        <li><a href="research-background.html" target="content-frame">研究緣起</a></li>
        <li><a href="methods.html" target="content-frame">研究方法</a></li>
        <li><a href="tezuka.html" target="content-frame">手塚治虫</a></li>
        <li><a href="theory.html" target="content-frame">理論根據</a></li>
        <li><a href="interviews.html" target="content-frame">訪談結果</a></li>
        <li><a href="discussion.html" target="content-frame">討論及建議</a></li>
        <li><a href="creative-synthesis.html" target="content-frame">創意合成</a></li>
        <li><a href="limitations.html" target="content-frame">侷限：限制與前瞻</a></li>
        <li><a href="references.html" target="content-frame">參考文獻</a></li>
      </ul>
    </aside>

    <main class="main" role="main">
      <div class="iframe-wrap">
        <!-- 右側會載入你原本的頁面（index_2.html），完全保留原始內容 -->
        <iframe id="content-frame" name="content-frame" src="index_2.html" title="主要內容"></iframe>
      </div>
    </main>
  </div>
</body>
</html>
