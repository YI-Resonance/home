<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>伍嘉豪 作品集 Portfolio of Billy Ng</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 50px 40px;
            max-width: 650px;
            text-align: center;
        }

        h1 {
            font-size: 2.3em;
            color: #333;
            margin-bottom: 10px;
        }

        .subtitle {
            font-size: 1.1em;
            color: #666;
            margin-bottom: 30px;
        }

        .intro {
            color: #555;
            line-height: 1.8;
            font-size: 1em;
            margin: 30px 0;
            text-align: left;
        }

        /* ----------------------------- */
        /* 圖片按鈕區域 */
        /* ----------------------------- */

        .link-grid {
            display: grid;
            grid-template-columns: repeat(3, 120px); /* 每格固定 120px */
            gap: 25px;
            justify-content: center;
            margin-top: 30px;
        }

        .link-item {
            width: 120px;                 /* 固定按鈕寬度（最重要） */
            display: flex;
            flex-direction: column;       /* 圖片在上、文字在下 */
            align-items: center;
            text-decoration: none;        /* 去除底線 */
        }

        .link-item img {
            width: 120px;
            height: 120px;
            object-fit: cover;            /* 裁切填滿 */
            border-radius: 14px;
            border: none;                 /* 無邊框 */
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .link-item img:hover {
            transform: translateY(-6px);
            box-shadow: 0 12px 25px rgba(0, 0, 0, 0.25);
        }

        .link-text {
            margin-top: 8px;
            font-size: 0.9em;
            color: #555;
            text-align: center;
        }

        /* 手機版：自動縮成兩個一行 */
        @media (max-width: 600px) {
            .link-grid {
                grid-template-columns: repeat(2, 120px);
            }
        }

        .footer {
            margin-top: 50px;
            padding-top: 20px;
            border-top: 1px solid #eee;
            color: #999;
            font-size: 0.9em;
        }
    </style>
</head>

<body>
    <div class="container">

        <h1>伍嘉豪 作品集</h1>
        <h1>Portfolio of Billy Ng</h1>
        <p class="subtitle">歡迎來到我的作品集（持續更新）</p>

        <div class="intro">
            <p>你好！歡迎！</p>
            <p>詩人 / 心靈樹師</p>
        </div>

        <p style="margin-bottom: 20px; color: #666;">探索我的作品：</p>

        <!-- 圖片按鈕區 -->
        <div class="link-grid">

            

            <a href="#" class="link-item">
                <img src="logo_mandorla_sq-01.png" alt="作品2">
                <span class="link-text">新景律 - <br>基督教信仰<br>仿唐詩作品</span>
            </a>

	    <a href="https://yi-resonance.github.io/mandala_chi/" target="_new" class="link-item">
                <img src="mandala_mandala.png" alt="曼陀羅生成器">
                <span class="link-text">曼陀羅生成器</span>
            </a>

            <!--<a href="#" class="link-item">
                <img src="your_image3.png" alt="作品3">
                <span class="link-text">作品 3</span>
            </a>

	    <a href="#" class="link-item">
                <img src="your_image3.png" alt="作品3">
                <span class="link-text">作品 4</span>
            </a>-->


        </div>

        <div class="footer">
            <p>© 2026 YI-Resonance. All rights reserved.</p>
        </div>

    </div>
</body>
</html>
